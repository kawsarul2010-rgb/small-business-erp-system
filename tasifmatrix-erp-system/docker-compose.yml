# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tasifmatrix_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: run the whole app in a container (http://localhost:8080)
  app:
    profiles: ["app"]
    build: .
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tasifmatrix_erp;Username=postgres;Password=postgres"
      Jwt__SigningKey: "local-docker-signing-key-change-me-0123456789"
      SEED_SUPERADMIN_EMAIL: "owner@tasifmatrix.local"
      SEED_SUPERADMIN_PASSWORD: "Owner@12345"
      App__PublicBaseUrl: "http://localhost:8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
